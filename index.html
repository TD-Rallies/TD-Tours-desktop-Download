<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Rallies — Download</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f4f8;color:#162235;padding:18px}
.card{width:min(100%,520px);background:#fff;border:1px solid #d9e0e9;border-radius:16px;padding:30px;box-shadow:0 10px 32px #1a30420d;text-align:center}
.brand{font-size:13px;font-weight:700;letter-spacing:.08em;color:#536477;text-transform:uppercase}
h1{font-size:28px;margin:12px 0}p{line-height:1.5;color:#536477;margin:0 0 24px}
a.download{display:block;border-radius:10px;background:#2563eb;color:#fff;padding:15px 18px;text-decoration:none;font-size:17px;font-weight:700}
a.download:hover,a.download:focus-visible{background:#1d4ed8}
.note{font-size:13px;color:#68778a;margin:18px 0 0}
</style>
</head>
<body>
<main class="card">
<div class="brand">TD Rallies</div>
<h1 id="packageTitle">TD Tours</h1>
<p>Download the complete application package for use on your computer.</p>
<a class="download" id="downloadLink" href="TD_Tours.zip" download>Download TD Tours ZIP</a>
<div class="note">After downloading, extract the ZIP folder and follow the included instructions.</div>
</main>
<script>
// ==========================================================
// EDIT THESE TWO LINES FOR EACH REPOSITORY
// Examples: TD Tours / TD_Tours_download.zip
//           TD2 / TD2_Rallies.zip
//           TD7 / TD7_Rallies.zip
// ==========================================================
const PACKAGE_NAME = 'TD Tours';
const ZIP_FILENAME = 'TD_Tours.zip';
// ==========================================================

document.title = PACKAGE_NAME + ' — Download';
document.getElementById('packageTitle').textContent = PACKAGE_NAME;
const link = document.getElementById('downloadLink');
link.textContent = 'Download ' + PACKAGE_NAME + ' ZIP';
link.href = './' + encodeURIComponent(ZIP_FILENAME);
link.setAttribute('download', ZIP_FILENAME);
</script>
</body>
</html>
